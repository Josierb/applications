  <script>
  (function(){
    function burst(svgEl){
      var rect = svgEl.getBoundingClientRect();
      var cx = rect.left + rect.width/2;
      var cy = rect.top + rect.height/2;
      var colors = ['#ffd23f','#ffb703','#fca311'];
      for(var i=0;i<10;i++){
        var p = document.createElement('div');
        p.className='petal';
        var angle = (Math.PI*2*i)/10 + Math.random()*0.4;
        var dist = 60 + Math.random()*40;
        p.style.setProperty('--dx', Math.cos(angle)*dist+'px');
        p.style.setProperty('--dy', Math.sin(angle)*dist+'px');
        p.style.left = cx+'px';
        p.style.top = cy+'px';
        p.style.background = colors[i % colors.length];
        document.body.appendChild(p);
        (function(el){ el.addEventListener('animationend', function(){ el.remove(); }); })(p);
      }
    }
    document.querySelectorAll('.head').forEach(function(h){
      h.style.cursor = 'pointer';
      h.setAttribute('aria-label', 'Click for a surprise');
      h.addEventListener('click', function(){ burst(h); });
    });
  })();
  </script>
